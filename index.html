<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VIBE STATION | Where places become music.</title>
    <meta name="description" content="Immerse in Bollywood ambient soundscapes - Bus rides, Vintage Salons, Monsoon Rain & Morning Vibes with non-stop lo-fi music, real-time soundboards and dynamic visual scenes." />
    
    <!-- Cybersecurity Hardening Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' blob: https:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://www.googleapis.com https://www.youtube.com;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="permissions-policy" content="camera=(), microphone=(), geolocation=(), payment=()" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', '-apple-system', 'sans-serif'],
              heading: ['Outfit', 'sans-serif'],
              display: ['Rozha One', 'serif']
            },
            colors: {
              slate: {
                950: '#090a0f'
              }
            }
          }
        }
      }
    </script>
    <!-- Google Fonts with SRI & Crossorigin Protection -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
